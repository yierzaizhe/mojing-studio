<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerDesk · SVG 浏览器验收</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17191d;color:#dce1e8;font:14px/1.65 system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto;padding:30px}h1{font-size:24px;margin:0 0 6px}p{color:#9aa4b5;margin:0 0 20px}button{background:#2b3342;color:#e5ecf8;border:1px solid #46536a;border-radius:5px;padding:8px 14px;margin:0 8px 8px 0;cursor:pointer}button:disabled{opacity:.4;cursor:wait}#summary{padding:14px 16px;background:#252a34;border:1px solid #3d485a;border-radius:6px;margin:12px 0;font-weight:600}.pass{color:#80ddb0}.fail{color:#ff8b8b}.running{color:#8dbbff}li{padding:6px 10px;border-bottom:1px solid #303641}ol{padding-left:26px}.preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.preview-grid figure{margin:0}.preview-grid canvas{display:block;max-width:100%;height:auto;max-height:390px;border:1px solid #46536a;background:repeating-conic-gradient(#fff 0 25%,#ddd 0 50%) 50%/16px 16px}.preview-grid figcaption{color:#aab7ca;font-size:12px;padding:6px 0}pre{font:12px/1.6 ui-monospace,monospace;padding:18px;background:#101216;border:1px solid #303641;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:5px}a{color:#8dbbff}
</style>
<main>
<h1>SVG 浏览器验收</h1>
<p>运行交付 HTML 内的 SVG 适配器与导出 Worker，核验分组、矢量渲染、透明命中、单层与水印导出。测试文件只从本机服务读取。</p>
<button id="run">重新运行</button><button id="save">保存验收 JSON</button><a href="../index.html">返回工具</a>
<div id="summary" aria-live="polite">准备验收…</div><ol id="checks"></ol><div id="previews" class="preview-grid"></div><pre id="result">{}</pre>
</main>
<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id),results=[],pending=new Map();
  let busy=false,worker,workerUrl,adapter,counter=0,workerSource,adapterSource;
  const flatten=nodes=>(nodes||[]).flatMap(n=>[n,...flatten(n.children)]);
  const assert=(value,message)=>{if(!value)throw new Error(message);};
  function update(){const r={done:!busy,passed:results.filter(r=>r.pass).length,failed:results.filter(r=>!r.pass).length,checks:results};window.__svgQaResult=r;$('result').textContent=JSON.stringify(r,null,2);$('summary').textContent=`${busy?'运行中':'验收结束'} · ${r.passed} 项通过 · ${r.failed} 项失败`;$('summary').className=r.failed?'fail':busy?'running':'pass';}
  function lock(value){busy=value;document.querySelectorAll('button').forEach(button=>button.disabled=value);update();}
  async function check(name,fn){const li=document.createElement('li');li.textContent=`运行 · ${name}`;li.className='running';$('checks').append(li);const start=performance.now();try{const detail=await fn();results.push({name,pass:true,ms:Math.round(performance.now()-start),...(detail===undefined?{}:{detail})});li.textContent=`PASS · ${name}`;li.className='pass';}catch(error){results.push({name,pass:false,ms:Math.round(performance.now()-start),error:error.message});li.textContent=`FAIL · ${name} · ${error.message}`;li.className='fail';}update();}
  async function bootstrap(){
    const response=await fetch('../index.html');assert(response.ok,'交付 HTML 不存在，请先构建');
    const doc=new DOMParser().parseFromString(await response.text(),'text/html');
    workerSource=doc.getElementById('psd-worker-source')?.textContent;
    adapterSource=doc.getElementById('svg-adapter-source')?.textContent;
    assert(workerSource&&adapterSource,'交付物没有内置 SVG 适配器与导出 Worker');
    const script=document.createElement('script');script.textContent=adapterSource;document.body.append(script);
    assert(typeof window.LayerDeskSvgDocument==='function','SVG 适配器未正确注册');
    if(worker)worker.terminate();if(workerUrl)URL.revokeObjectURL(workerUrl);
    workerUrl=URL.createObjectURL(new Blob([workerSource],{type:'text/javascript'}));worker=new Worker(workerUrl);
    worker.onmessage=e=>{const r=e.data,p=pending.get(r.id);if(!p){r.bitmap?.close();return;}pending.delete(r.id);clearTimeout(p.timeout);r.ok?p.resolve(r):p.reject(new Error(r.error||'导出 Worker 出错'));};
    worker.onerror=e=>{for(const p of pending.values()){clearTimeout(p.timeout);p.reject(new Error(e.message));}pending.clear();};
  }
  function requestWorker(type,args={},transfer=[]){return new Promise((resolve,reject)=>{const id=++counter;const timeout=setTimeout(()=>{pending.delete(id);reject(new Error(`${type} 超过 30 秒`));},30000);pending.set(id,{resolve,reject,timeout});worker.postMessage({id,type,...args},transfer);});}
  async function fetchFile(name){const r=await fetch(name);assert(r.ok,`${name} HTTP ${r.status}`);return new File([await r.blob()],name,{type:'image/svg+xml'});}
  async function open(name){adapter?.dispose();adapter=new window.LayerDeskSvgDocument({requestWorker});const r=await adapter.open(await fetchFile(name));return {doc:r.doc,nodes:flatten(r.doc.children)};}
  function capture(bitmap,label,show=false){assert(bitmap instanceof ImageBitmap,'没有返回 ImageBitmap');const c=document.createElement('canvas');c.width=bitmap.width;c.height=bitmap.height;c.getContext('2d').drawImage(bitmap,0,0);bitmap.close();if(show){const f=document.createElement('figure'),caption=document.createElement('figcaption');caption.textContent=label;f.append(c,caption);$('previews').append(f);}return c;}
  const pixel=(c,x,y)=>[...c.getContext('2d').getImageData(x,y,1,1).data];
  const near=(actual,expected,tolerance=3)=>actual.every((v,i)=>Math.abs(v-expected[i])<=tolerance);
  const byId=(nodes,id)=>nodes.find(n=>n.svgId===id);
  async function canvasRender(payload,caption,show=false){const r=await adapter.handle('render',payload);return {result:r,canvas:capture(r.bitmap,caption,show)};}
  function imageDifference(a,b){assert(a.width===b.width&&a.height===b.height,'比较图尺寸不一致');const x=a.getContext('2d').getImageData(0,0,a.width,a.height).data,y=b.getContext('2d').getImageData(0,0,b.width,b.height).data;let count=0,total=0;for(let i=0;i<x.length;i++){total+=Math.abs(x[i]-y[i]);if(x[i]!==y[i])count++;}return {changedChannels:count,mean:total/x.length};}
  async function run(){
    if(busy)return;results.length=0;$('checks').replaceChildren();$('previews').replaceChildren();lock(true);
    try{
      await check('交付物内置 SVG 解析与本地图片导出能力',bootstrap);if(!workerSource||!adapterSource)return;
      let sample,sampleImage,sampleOriginal;
      await check('SVG 分组与可视元素保留，定义和 tspan 不重复列为图层',async()=>{
        sample=await open('svg-sample.svg');const {doc,nodes}=sample;
        assert(doc.format==='svg','文件类型不是 SVG');assert(doc.width===1000&&doc.height===750,'样例画布尺寸错误');
        assert(doc.count===nodes.length&&doc.count>=20&&doc.count<30,`可视节点数异常 ${doc.count}`);
        assert(nodes.filter(n=>n.type==='group').length===4,'分组数量错误');
        assert(!nodes.some(n=>['defs','mask','clipPath','radialGradient','linearGradient','stop','symbol','style','tspan'].includes(n.svgTag)),'定义元素被误列为可视图层');
        assert(byId(nodes,'main-title')?.type==='text'&&byId(nodes,'main-title').text.includes('VECTOR'),'文字元数据丢失');
        assert(byId(nodes,'cross-instance')?.svgTag==='use','symbol/use 实例丢失');
        assert(byId(nodes,'embedded-image')?.type==='pixel','内嵌图片类型错误');
        assert(byId(nodes,'hidden-group')?.hidden,'CSS 隐藏分组状态丢失');
        return {width:doc.width,height:doc.height,nodes:doc.count,warnings:doc.warnings};
      });
      if(sample){
        await check('原生 SVG 渲染保留渐变、镂空路径与内嵌 PNG',async()=>{
          sampleImage=await canvasRender({mode:'original',maxSize:1000},'SVG 样例原图',true);sampleOriginal=sampleImage.canvas;
          assert(near(pixel(sampleOriginal,700,140),[73,119,240,255]),'蓝色色块未显示');
          const orb=pixel(sampleOriginal,660,340);assert(orb[0]>200&&orb[1]>80&&orb[2]<200,'渐变球体没有正确绘制');
          assert(near(pixel(sampleOriginal,815,470),[73,119,240,255]),'镂空圆环未穿透至蓝色背景');
          assert(near(pixel(sampleOriginal,880,470),[41,92,78,255]),'绿色圆环填充错误');
          const embedded=pixel(sampleOriginal,835,617);assert(embedded[2]>150&&embedded[0]<100,'内嵌 PNG 未绘制');
          return {width:sampleOriginal.width,height:sampleOriginal.height};
        });
        await check('SVG 矢量放大按更高分辨率重新渲染',async()=>{
          const {canvas:c,result:r}=await canvasRender({mode:'original',maxSize:2400,renderScale:2},'两倍 SVG');
          assert(c.width===2000&&c.height===1500,`放大结果 ${c.width}×${c.height}`);assert(r.documentWidth===1000&&r.documentHeight===750,'放大改变了原文档坐标');
          assert(near(pixel(c,1400,280),[73,119,240,255]),'高分辨率矢量色块错误');return {width:c.width,height:c.height};
        });
        await check('SVG 元素可生成缩略图与单独预览',async()=>{
          const orb=byId(sample.nodes,'orange-orb');const thumb=await adapter.handle('thumbnail',{layerId:orb.id});const c=capture(thumb.bitmap,'圆形缩略图');
          assert(Math.max(c.width,c.height)<=64&&Math.min(c.width,c.height)>0,'缩略图尺寸错误');
          const one=await canvasRender({mode:'layer',layerId:orb.id,maxSize:1000},'SVG 单层球体',true);
          assert(one.canvas.width>=309&&one.canvas.width<=312,'单层范围未裁剪到球体');assert(pixel(one.canvas,0,0)[3]===0,'圆形外角没有保留透明');
          return {thumbnail:[c.width,c.height],layer:[one.canvas.width,one.canvas.height],origin:[one.result.originX,one.result.originY]};
        });
        await check('SVG 单层 PNG 保留剪贴后的透明角落',async()=>{
          const node=byId(sample.nodes,'embedded-image');const r=await adapter.handle('export',{mode:'layer',layerId:node.id,format:'png'});
          assert(r.blob.type==='image/png','单层导出不是 PNG');const c=capture(await createImageBitmap(r.blob),'SVG 内嵌图片单层 PNG');
          assert(c.width>=67&&c.width<=70&&c.height>=67&&c.height<=70,'内嵌图片导出范围错误');
          assert(pixel(c,0,0)[3]===0&&pixel(c,Math.floor(c.width/2),Math.floor(c.height/2))[3]>240,'clipPath 没有参与单层导出');return {width:c.width,height:c.height,bytes:r.blob.size};
        });
        await check('SVG 可导出带文字水印的 JPG，透明区域使用指定底色',async()=>{
          const node=byId(sample.nodes,'orange-orb');const r=await adapter.handle('export',{mode:'layer',layerId:node.id,format:'jpeg',quality:.9,background:'#124b8d',watermark:{enabled:true,text:'SVG SAMPLE',position:'center',color:'#ffffff',size:10,opacity:.75}});
          assert(r.blob.type==='image/jpeg','未编码成 JPEG');const bytes=new Uint8Array(await r.blob.slice(0,3).arrayBuffer());assert(bytes[0]===255&&bytes[1]===216&&bytes[2]===255,'JPEG 文件签名错误');
          const c=capture(await createImageBitmap(r.blob),'SVG 单层 JPG 水印',true);assert(near(pixel(c,0,0),[18,75,141,255],7),'透明角落的 JPG 底色错误');
          const noMark=await adapter.handle('export',{mode:'layer',layerId:node.id,format:'jpeg',quality:.9,background:'#124b8d'});const plain=capture(await createImageBitmap(noMark.blob),'无水印 JPG');
          assert(imageDifference(c,plain).mean>.1,'水印未进入实际导出图片');return {bytes:r.blob.size,format:r.blob.type};
        });
        await check('SVG 整图缩小导出与水印预览一致，并且不污染源文档',async()=>{
          const settings={mode:'original',format:'png',exportSize:500,watermark:{enabled:true,text:'VECTOR',position:'tile',color:'#14251f',size:8,opacity:.35}};
          const r=await adapter.handle('export',settings),c=capture(await createImageBitmap(r.blob),'SVG 平铺水印 PNG',true);assert(c.width===500&&c.height===375,'缩小导出尺寸错误');
          const preview=await adapter.handle('exportPreview',{...settings,maxSize:500});const p=capture(preview.bitmap,'SVG 水印预览');assert(preview.exportWidth===500&&preview.exportHeight===375,'预览计划尺寸错误');
          assert(imageDifference(c,p).mean<.1,'同尺寸水印预览与 PNG 输出不一致');
          const fresh=await canvasRender({mode:'original',maxSize:1000},'导出后原图');assert(imageDifference(sampleOriginal,fresh.canvas).changedChannels===0,'水印污染了原始 SVG 预览');
          return {width:c.width,height:c.height,previewDifference:imageDifference(c,p).mean};
        });
      }
      let probe,probeImage;
      await check('非零 viewBox 与旋转变换转换为画布像素坐标',async()=>{
        probe=await open('svg-probes.svg');const red=byId(probe.nodes,'red'),green=byId(probe.nodes,'rotated-green');
        assert(probe.doc.width===128&&probe.doc.height===96,'viewBox 文档尺寸错误');
        assert(Math.abs(red.left-8)<1&&Math.abs(red.top-8)<1&&Math.abs(red.width-32)<1&&Math.abs(red.height-32)<1,`red bounds ${JSON.stringify(red)}`);
        assert(Math.abs(green.left-48)<1&&Math.abs(green.top-8)<1&&Math.abs(green.width-16)<1&&Math.abs(green.height-24)<1,`rotated bounds ${JSON.stringify(green)}`);
        const r=await canvasRender({mode:'original',maxSize:128},'SVG 坐标与蒙版探针',true);probeImage=r.canvas;return {red:[red.left,red.top,red.width,red.height],rotated:[green.left,green.top,green.width,green.height]};
      });
      if(probe){
        const probes=[[[16,16],[255,0,0,255],'初始隐藏层不遮盖红色'],[[56,16],[0,192,0,255],'旋转变换'],[[10,60],[0,0,0,255],'偶奇路径实心边'],[[24,72],[255,255,255,255],'偶奇路径镂空'],[[64,72],[255,0,255,255],'clipPath 内部'],[[53,58],[255,255,255,255],'clipPath 外部'],[[96,72],[255,255,0,255],'mask 白色'],[[112,72],[255,255,255,255],'mask 黑色'],[[100,20],[255,255,255,255],'描边圆内部空白'],[[114,20],[0,0,255,255],'圆形描边']];
        await check('SVG 路径、描边、剪贴与蒙版的 10 个像素探针',()=>{assert(probeImage,'探针图未生成');for(const [at,wanted,label]of probes){const actual=pixel(probeImage,...at);assert(near(actual,wanted,4),`${label} (${at}) 得到${actual}, 预期${wanted}`);}return {probes:probes.length};});
        await check('SVG 点击选层按真实形状穿透透明洞、mask 与 clipPath',async()=>{
          const points=[[[16,16],'red'],[[56,16],'rotated-green'],[[10,60],'ring'],[[24,72],'background'],[[64,72],'clipped-magenta'],[[53,58],'background'],[[96,72],'masked-yellow'],[[112,72],'background'],[[100,20],'background'],[[114,20],'stroke-circle']];
          const hits=[];for(const [at,id]of points){const r=await adapter.handle('hitTest',{mode:'original',x:at[0],y:at[1]});const expected=byId(probe.nodes,id);assert(r.layerId===expected.id,`(${at}) 应选 ${id}，得到 ${r.candidates?.map(n=>n.name).join(',')}`);hits.push({at,svgId:id});}return {probes:hits.length,hits};
        });
        await check('SVG 可显示原本 CSS 隐藏元素，原始预览保留保存时显隐',async()=>{
          const {canvas:c}=await canvasRender({mode:'composite',hiddenIds:[],maxSize:128},'显示隐藏蓝色元素');assert(near(pixel(c,16,16),[0,0,255,255]),'隐藏的蓝色层无法显示');
          const h=await adapter.handle('hitTest',{mode:'composite',hiddenIds:[],x:16,y:16});assert(h.layerId===byId(probe.nodes,'hidden-blue').id,'显示后未命中最上层蓝色');
          const original=await canvasRender({mode:'original',maxSize:128},'原始显隐');assert(near(pixel(original.canvas,16,16),[255,0,0,255]),'显隐切换污染了原始预览');
        });
        await check('SVG 单层原始坐标偏移与重叠候选顺序正确',async()=>{
          const red=byId(probe.nodes,'red'),one=await canvasRender({mode:'layer',layerId:red.id,maxSize:128},'红色单层');assert(one.canvas.width===32&&one.canvas.height===32,'单层没有按文档像素裁剪');
          assert(one.result.originX===8&&one.result.originY===8,'单层文档偏移错误');assert(near(pixel(one.canvas,16,16),[255,0,0,255]),'单层导出了其他覆盖元素');
          const hit=await adapter.handle('hitTest',{mode:'composite',hiddenIds:[],x:16,y:16});assert(hit.candidates[0].id===byId(probe.nodes,'hidden-blue').id&&hit.candidates.some(n=>n.id===red.id),'重叠候选顺序错误');return {origin:[one.result.originX,one.result.originY],candidates:hit.candidates.map(n=>n.name)};
        });
      }
      await check('SVG 毫米尺寸按 96dpi 换算，百分比尺寸可使用 viewBox',async()=>{
        const unit=await open('svg-units.svg');assert(Math.abs(unit.doc.width-96)<1&&Math.abs(unit.doc.height-48)<1,`mm 尺寸 ${unit.doc.width}×${unit.doc.height}`);
        const u=await canvasRender({mode:'original',maxSize:200},'毫米单位');assert(near(pixel(u.canvas,24,24),[211,75,53,255]),'毫米文档未正确渲染');
        const percent=await open('svg-percent.svg');assert(percent.doc.width===120&&percent.doc.height===80,`百分比回退尺寸 ${percent.doc.width}×${percent.doc.height}`);return {units:[unit.doc.width,unit.doc.height],percent:[percent.doc.width,percent.doc.height]};
      });
      await check('SVG 默认字体与工具界面隔离，单层文字 PNG 不裁掉字形',async()=>{
        const previousFont=document.body.style.font;
        document.body.style.font='11px system-ui';
        try{
          adapter?.dispose();adapter=new window.LayerDeskSvgDocument({requestWorker});
          const file=new File(['<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80"><text id="default-text" x="10" y="35">VECTOR</text></svg>'],'default.svg',{type:'image/svg+xml'});
          const opened=await adapter.open(file),target=byId(flatten(opened.doc.children),'default-text');
          assert(target?.type==='text','默认文字元素未读取');
          const original=await canvasRender({mode:'original',maxSize:200},'SVG 默认字体原图');
          const exported=await adapter.handle('export',{mode:'layer',layerId:target.id,format:'png'});
          assert(exported.blob.type==='image/png','默认文字单层未导出 PNG');
          const layer=capture(await createImageBitmap(exported.blob),'默认字体单层 PNG');
          function coverage(canvas){const pixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;let alpha=0,nonzero=0;for(let i=3;i<pixels.length;i+=4){alpha+=pixels[i];if(pixels[i])nonzero++;}return {alpha:alpha/255,nonzero};}
          const full=coverage(original.canvas),single=coverage(layer);
          assert(full.alpha>10&&full.nonzero>10,'原始默认文字没有画出');
          const alphaDifference=Math.abs(full.alpha-single.alpha)/full.alpha;
          const pixelDifference=Math.abs(full.nonzero-single.nonzero)/full.nonzero;
          assert(alphaDifference<=.05&&pixelDifference<=.05,`默认字体被页面样式污染或裁剪：原始${JSON.stringify(full)}，单层${JSON.stringify(single)}`);
          return {original:full,layer:single,alphaDifference,pixelDifference,bounds:[target.left,target.top,target.width,target.height]};
        }finally{document.body.style.font=previousFont;}
      });
      await check('SVG 中的脚本、事件、外部资源与动画不会执行',async()=>{
        window.__svgUnsafeExecuted=false;const unsafe=await open('svg-unsafe.svg');const rendered=await canvasRender({mode:'original',maxSize:64},'已清理 SVG');
        assert(window.__svgUnsafeExecuted===false,'SVG 文件代码被执行');assert(near(pixel(rendered.canvas,24,24),[18,165,95,255]),'清理后安全图形消失或动画仍执行');
        assert((unsafe.doc.warnings||[]).length>0,'清理外部资源没有说明');return {warnings:unsafe.doc.warnings,scriptExecuted:window.__svgUnsafeExecuted};
      });
      await check('损坏 XML 与非 SVG 内容返回可读错误',async()=>{
        let malformed,notSvg;try{await open('svg-malformed.svg');}catch(error){malformed=error.message;}assert(malformed,'坏 XML 没有报错');
        adapter?.dispose();adapter=new window.LayerDeskSvgDocument({requestWorker});try{await adapter.open(new File(['<html><body>Not SVG</body></html>'],'not-svg.svg',{type:'image/svg+xml'}));}catch(error){notSvg=error.message;}assert(notSvg,'非 SVG 内容没有报错');return {malformed,notSvg};
      });
    }finally{adapter?.dispose();lock(false);}
  }
  $('run').onclick=()=>run().catch(error=>{$('summary').textContent=`验收页异常：${error.message}`;lock(false);});
  $('save').onclick=()=>{const blob=new Blob([$('result').textContent],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='svg-browser-results.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
  run().catch(error=>{$('summary').textContent=`验收页异常：${error.message}`;lock(false);});
})();
</script>
</html>
