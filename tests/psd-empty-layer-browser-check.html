<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨境 Studio · PSD 特殊图层验收</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17191d;color:#dce1e8;font:14px/1.6 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:20px}h1{font-size:24px;margin:0}p{color:#abb5c4}button{padding:8px 14px;background:#2b3342;color:#e5ecf8;border:1px solid #46536a;border-radius:4px;cursor:pointer}button:disabled{opacity:.5}a{color:#8dbbff}#summary{padding:12px 14px;background:#252a34;border:1px solid #3d485a;margin:16px 0}.pass{color:#80ddb0}.fail{color:#ff8b8b}iframe{display:block;width:100%;height:760px;border:1px solid #535a66;background:#292929}pre{font:12px/1.5 ui-monospace,monospace;padding:16px;background:#101216;white-space:pre-wrap}</style>
<main><h1>PSD 特殊图层与错误恢复验收</h1><p>在真实工作台内打开分层 PSD，检查空分组、调整层的双击、显隐、预览和导出，以及正常图层的恢复。</p><button id="run">重新运行</button> <a href="../index.html">返回工作台</a><div id="summary">准备验收…</div><ol id="checks"></ol><iframe id="preview" title="墨境 Studio PSD 特殊图层实际界面"></iframe><pre id="result">{}</pre></main>
<script>
(() => {
 'use strict';const $=id=>document.getElementById(id),records=[];let busy=false,win,doc,metadata,fileName;
 const el=id=>doc.getElementById(id),canvas=()=>el('stage-canvas'),assert=(v,m)=>{if(!v)throw new Error(m);},sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const nodes=(list=metadata?.children||[])=>list.flatMap(n=>[n,...nodes(n.children||[])]),row=id=>doc.querySelector(`.layer-row[data-id="${id}"]`);
 async function until(fn,label){const start=performance.now();while(performance.now()-start<45000){if(fn())return;await sleep(20);}throw new Error('等待超时：'+label);}
 async function idle(){await until(()=>!canvas().hidden&&canvas().width>1&&el('canvas-viewport').getAttribute('aria-busy')==='false'&&el('loading-overlay').hidden,'画面就绪');await new Promise(r=>win.requestAnimationFrame(()=>win.requestAnimationFrame(r)));}
 const pixels=()=>canvas().getContext('2d').getImageData(0,0,canvas().width,canvas().height).data;
 const snapshot=()=>({width:canvas().width,height:canvas().height,data:[...pixels()]});
 function unchanged(before){assert(before.width===canvas().width&&before.height===canvas().height,'画布尺寸意外变化');const data=pixels();assert(data.length===before.data.length&&data.every((v,i)=>v===before.data[i]),'原始画面像素变化');}
 const change=(id,value)=>{el(id).value=value;el(id).dispatchEvent(new win.Event('change',{bubbles:true}));};
 const reveal=node=>{el('layer-search').value=node.name;el('layer-search').dispatchEvent(new win.Event('input',{bubbles:true}));};
 const double=id=>row(id).querySelector('.layer-name').dispatchEvent(new win.MouseEvent('dblclick',{bubbles:true}));
 const noErrors=()=>assert(win.__psdLayerCheck.errors.length===0,'Worker收到失败请求：'+win.__psdLayerCheck.errors.join('；'));
 function update(){const result={done:!busy,passed:records.filter(r=>r.pass).length,failed:records.filter(r=>!r.pass).length,checks:records};$('result').textContent=JSON.stringify(result,null,2);$('summary').textContent=`${busy?'运行中':'验收结束'} · ${result.passed} 项通过 · ${result.failed} 项失败`;$('summary').className=result.failed?'fail':'pass';$('run').disabled=busy;}
 async function check(name,fn){const li=document.createElement('li'),start=performance.now();li.textContent='运行 · '+name;$('checks').append(li);try{const detail=await fn();records.push({name,pass:true,ms:Math.round(performance.now()-start),detail});li.className='pass';li.textContent='PASS · '+name;}catch(error){records.push({name,pass:false,error:error.message});li.className='fail';li.textContent='FAIL · '+name+' · '+error.message;}update();}
 async function run(){if(busy)return;busy=true;records.length=0;$('checks').replaceChildren();update();try{
  let source=await (await fetch('../index.html',{cache:'no-store'})).text();
  const instrument=`(() => {const Native=window.Worker;window.__psdLayerCheck={requests:[],errors:[],documents:[]};window.Worker=class extends Native{constructor(...args){super(...args);this.addEventListener('message',event=>{const r=event.data;if(r.ok===false)window.__psdLayerCheck.errors.push(r.error);if(r.doc)window.__psdLayerCheck.documents.push(r.doc);});}postMessage(message,transfer){window.__psdLayerCheck.requests.push({type:message.type,mode:message.mode,layerId:message.layerId});super.postMessage(message,transfer);}};})();`;
  source=source.replace('<head>','<head><script>'+instrument+'<'+ '/script>');const frame=$('preview'),loaded=new Promise(r=>frame.addEventListener('load',r,{once:true}));frame.srcdoc=source;await loaded;win=frame.contentWindow;doc=frame.contentDocument;await until(()=>el('file-input')?.onchange,'工作台就绪');
  const response=await fetch('compositing.psd',{cache:'no-store'});assert(response.ok,'缺少分层PSD');fileName='特殊图层检查.psd';const file=new win.File([await response.arrayBuffer()],fileName,{type:'image/vnd.adobe.photoshop'}),transfer=new win.DataTransfer();transfer.items.add(file);el('file-input').files=transfer.files;el('file-input').dispatchEvent(new win.Event('change',{bubbles:true}));await until(()=>el('document-tab').textContent===fileName,'PSD导入');await idle();metadata=win.__psdLayerCheck.documents.at(-1);
  const adjustment=nodes().find(n=>n.type==='adjustment'),empty=nodes().find(n=>n.name==='empty group'),normal=nodes().find(n=>n.name==='red square');let original=snapshot();
  await check('真实PSD保留调整层和空组，并说明不能单独预览的原因',async()=>{assert(adjustment?.previewable===false&&empty?.previewable===false,'未标注无独立画面图层');assert(adjustment.previewReason&&empty.previewReason,'缺少可读说明');el('expand-all').click();assert(row(adjustment.id)&&row(empty.id),'特殊层没有保留在列表');noErrors();return{adjustment:adjustment.previewReason,empty:empty.previewReason,nodes:metadata.count};});
  await check('双击调整层保留原画面与属性，不发送失败单层请求',async()=>{const since=win.__psdLayerCheck.requests.length;double(adjustment.id);await idle();assert(el('mode-select').value==='original','调整层没有回到完整画面');assert(doc.querySelector('.layer-row.selected')?.dataset.id===adjustment.id,'调整层不能选中');assert(el('inspector').textContent.includes(adjustment.previewReason),'属性没有解释原因');assert(el('inspector').querySelector('[data-action="preview-layer"]').disabled,'不支持的预览仍可触发');assert(!win.__psdLayerCheck.requests.slice(since).some(r=>r.type==='render'&&r.mode==='layer'),'仍向Worker发送失败单层请求');unchanged(original);noErrors();return{selected:adjustment.name,pixelsPreserved:true};});
  await check('空组双击、当前图层和Alt独显均不报错',async()=>{double(empty.id);await idle();change('mode-select','layer');await idle();row(empty.id).querySelector('[data-action="eye"]').dispatchEvent(new win.MouseEvent('click',{bubbles:true,altKey:true}));await idle();assert(el('mode-select').value==='original','空组仍处于无法渲染的单层模式');unchanged(original);noErrors();return{selected:empty.name,errors:win.__psdLayerCheck.errors.length};});
  await check('特殊层仅禁用单层导出，整图PNG预览仍正常',async()=>{el('export-btn').click();await until(()=>el('export-dialog').open&&!el('export-preview-canvas').hidden,'整图导出预览');assert(el('export-scope').querySelector('[value="layer"]').disabled,'无画面的单层仍可导出');assert(!el('export-download').disabled,'整图导出被意外禁用');assert(el('export-details').textContent.includes('128 × 96'),'整图导出尺寸错误');el('export-close').click();noErrors();return{currentExportAvailable:true};});
  await check('正常层仍可独立预览，切回空组后恢复完整作品',async()=>{assert(normal?.previewable===true,'正常像素层被禁用');reveal(normal);double(normal.id);await idle();assert(el('mode-select').value==='layer'&&canvas().width<original.width,'正常单层预览失败');reveal(empty);row(empty.id).querySelector('.layer-name').click();await idle();assert(el('mode-select').value==='original','选中空组后没有恢复完整画面');unchanged(original);noErrors();return{normalLayer:normal.name,fullImageRestored:true};});
 }catch(error){await check('验收初始化或流程异常',()=>{throw error;});}finally{busy=false;update();}}
 $('run').onclick=run;run();
})();
</script></html>
