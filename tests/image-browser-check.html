<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LayerDesk · 图片导入验收</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17191d;color:#dce1e8;font:14px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:24px;margin:0 0 8px}p{color:#9ba9bb}button{padding:8px 14px;background:#2b3342;color:#e5ecf8;border:1px solid #46536a;border-radius:5px;cursor:pointer}button:disabled{opacity:.5}a{color:#8dbbff}#summary{padding:14px;background:#252a34;border:1px solid #3d485a;margin:18px 0}.pass{color:#80ddb0}.fail{color:#ff8b8b}.running{color:#8dbbff}li{padding:5px 0}#previews{display:flex;gap:18px;flex-wrap:wrap}figure{margin:10px 0;max-width:400px}canvas{display:block;max-width:100%;height:auto;border:1px solid #46536a;background:repeating-conic-gradient(#fff 0 25%,#ddd 0 50%) 50%/16px 16px}pre{font:12px/1.6 ui-monospace,monospace;padding:16px;background:#101216;white-space:pre-wrap;overflow-wrap:anywhere}</style>
<main><h1>图片导入验收</h1><p>使用交付 HTML 内的真实图片适配器和导出 Worker，检查透明图片、格式解码、方向、点选、显隐及水印导出。</p><button id="run">重新运行</button> <a href="../index.html">返回工具</a><div id="summary">准备验收…</div><ol id="checks"></ol><div id="previews"></div><pre id="result">{}</pre></main>
<script>
(() => {
  'use strict';
  const $=id=>document.getElementById(id),assert=(value,message)=>{if(!value)throw new Error(message);};
  const records=[],pending=new Map();let busy=false,worker,url,counter=0,adapter;
  function update(){const result={done:!busy,passed:records.filter(x=>x.pass).length,failed:records.filter(x=>!x.pass).length,checks:records};$('result').textContent=JSON.stringify(result,null,2);$('summary').textContent=`${busy?'运行中':'验收结束'} · ${result.passed} 项通过 · ${result.failed} 项失败`;$('summary').className=result.failed?'fail':busy?'running':'pass';$('run').disabled=busy;}
  async function check(name,fn){const li=document.createElement('li');li.className='running';li.textContent=`运行 · ${name}`;$('checks').append(li);const start=performance.now();try{const detail=await fn();records.push({name,pass:true,ms:Math.round(performance.now()-start),...(detail===undefined?{}:{detail})});li.className='pass';li.textContent=`PASS · ${name}`;}catch(error){records.push({name,pass:false,ms:Math.round(performance.now()-start),error:error.message});li.className='fail';li.textContent=`FAIL · ${name} · ${error.message}`;}update();}
  function requestWorker(type,payload={},transfer=[]){return new Promise((resolve,reject)=>{const id=++counter,timer=setTimeout(()=>{pending.delete(id);reject(new Error(`${type} 超过 30 秒`));},30000);pending.set(id,{resolve,reject,timer});worker.postMessage({id,type,...payload},transfer);});}
  const toBlob=(canvas,type='image/png',quality=.92)=>new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('无法生成图片测试文件')),type,quality));
  function capture(bitmap,label,show=false){const canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;canvas.getContext('2d').drawImage(bitmap,0,0);bitmap.close();if(show){const f=document.createElement('figure'),c=document.createElement('figcaption');c.textContent=label;f.append(c,canvas);$('previews').append(f);}return canvas;}
  const pixel=(canvas,x,y)=>[...canvas.getContext('2d').getImageData(x,y,1,1).data];
  const near=(a,b,t=3)=>a.every((v,i)=>Math.abs(v-b[i])<=t);
  function difference(a,b){assert(a.width===b.width&&a.height===b.height,'比较尺寸不同');const x=a.getContext('2d').getImageData(0,0,a.width,a.height).data,y=b.getContext('2d').getImageData(0,0,b.width,b.height).data;let count=0;for(let i=0;i<x.length;i+=4)if([0,1,2,3].some(c=>Math.abs(x[i+c]-y[i+c])>3))count++;return count;}
  function newAdapter(){adapter?.dispose();adapter=new window.LayerDeskImageDocument({requestWorker});return adapter;}
  function gifFile(){const bytes=[...new TextEncoder().encode('GIF89a'),1,0,1,0,128,0,0,255,0,0,0,0,255,...[33,255,11,...new TextEncoder().encode('NETSCAPE2.0'),3,1,0,0,0]];for(const index of [0,1])bytes.push(33,249,4,4,1,0,0,0,44,0,0,0,0,1,0,1,0,0,2,2,index?76:68,1,0);bytes.push(59);return new File([new Uint8Array(bytes)],'two-frame.gif',{type:'image/gif'});}
  function bmpFile(){const width=3,height=2,rowBytes=12,bytes=new Uint8Array(54+rowBytes*height),view=new DataView(bytes.buffer);bytes[0]=66;bytes[1]=77;view.setUint32(2,bytes.length,true);view.setUint32(10,54,true);view.setUint32(14,40,true);view.setInt32(18,width,true);view.setInt32(22,height,true);view.setUint16(26,1,true);view.setUint16(28,24,true);view.setUint32(34,rowBytes*height,true);for(let y=0;y<height;y++)for(let x=0;x<width;x++){const at=54+y*rowBytes+x*3;bytes.set([20,90,240],at);}return new File([bytes],'sample.bmp',{type:'image/bmp'});}
  async function orientedJpeg(){const c=document.createElement('canvas');c.width=40;c.height=20;const ctx=c.getContext('2d');ctx.fillStyle='#ff0000';ctx.fillRect(0,0,20,20);ctx.fillStyle='#0000ff';ctx.fillRect(20,0,20,20);const jpeg=new Uint8Array(await(await toBlob(c,'image/jpeg',1)).arrayBuffer());const segment=new Uint8Array([255,225,0,34,69,120,105,102,0,0,73,73,42,0,8,0,0,0,1,0,18,1,3,0,1,0,0,0,6,0,0,0,0,0,0,0]);return new File([jpeg.slice(0,2),segment,jpeg.slice(2)],'portrait-exif.jpg',{type:'image/jpeg'});}
  async function initialize(){
    const response=await fetch('../index.html');assert(response.ok,'请先构建 HTML');const dom=new DOMParser().parseFromString(await response.text(),'text/html'),source=dom.getElementById('image-adapter-source')?.textContent,workerSource=dom.getElementById('psd-worker-source')?.textContent;assert(source&&workerSource,'交付 HTML 缺少图片适配器或 Worker');
    new Function(source)();if(worker)worker.terminate();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([workerSource],{type:'text/javascript'}));worker=new Worker(url);worker.onmessage=e=>{const r=e.data,p=pending.get(r.id);if(!p){r.bitmap?.close();return;}pending.delete(r.id);clearTimeout(p.timer);r.ok?p.resolve(r):p.reject(new Error(r.error));};worker.onerror=e=>{for(const p of pending.values()){clearTimeout(p.timer);p.reject(new Error(e.message));}pending.clear();};
  }
  async function run(){
    if(busy)return;busy=true;records.length=0;$('checks').replaceChildren();$('previews').replaceChildren();update();
    try{
      await initialize();
      const source=document.createElement('canvas');source.width=200;source.height=120;const ctx=source.getContext('2d');ctx.fillStyle='#145a72';ctx.fillRect(20,20,100,60);
      const png=new File([await toBlob(source)],'transparent.png',{type:'image/png'});let pngDoc,original;
      await check('透明 PNG 以原始像素和一个图片图层导入',async()=>{pngDoc=(await newAdapter().open(png)).doc;assert(pngDoc.width===200&&pngDoc.height===120&&pngDoc.count===1&&pngDoc.children[0].id==='image-1','尺寸或图层结构错误');original=capture((await adapter.handle('render',{mode:'original',maxSize:200})).bitmap,'透明 PNG',true);assert(near(pixel(original,0,0),[0,0,0,0],0),'透明像素丢失');assert(near(pixel(original,50,40),[20,90,114,255],0),'原图颜色错误');return{format:pngDoc.imageFormat,width:pngDoc.width,height:pngDoc.height};});
      await check('图片 alpha 点选跳过透明区域，实心区域选中图片层',async()=>{const filled=await adapter.handle('hitTest',{x:50,y:40,mode:'original'}),empty=await adapter.handle('hitTest',{x:0,y:0,mode:'original'});assert(filled.layerId==='image-1'&&empty.layerId===null,'透明区域或实心点选错误');});
      await check('隐藏图片层得到透明画布，单层预览仍可查看',async()=>{const hidden=capture((await adapter.handle('render',{mode:'composite',hiddenIds:['image-1'],maxSize:200})).bitmap),selected=capture((await adapter.handle('render',{mode:'layer',layerId:'image-1',hiddenIds:['image-1'],maxSize:200})).bitmap);assert(pixel(hidden,50,40)[3]===0,'隐藏后仍有像素');assert(pixel(selected,50,40)[3]===255,'单层模式不能查看隐藏图片');assert((await adapter.handle('hitTest',{x:50,y:40,mode:'composite',hiddenIds:['image-1']})).layerId===null,'隐藏层仍被点选');});
      await check('缩略图按比例缩到 48 像素且没有放大原图',async()=>{const r=await adapter.handle('thumbnail',{layerId:'image-1'});assert(r.width===48&&r.height===29,`缩略图尺寸 ${r.width}×${r.height}`);r.bitmap.close();});
      await check('PNG 导出保持原尺寸与透明背景',async()=>{const r=await adapter.handle('export',{mode:'original',format:'png'}),c=capture(await createImageBitmap(r.blob),'导出 PNG');assert(r.blob.type==='image/png'&&c.width===200&&c.height===120,'PNG 编码或尺寸错误');assert(difference(original,c)===0,'PNG 导出改变原图像素');});
      await check('JPG 导出填充指定背景并使用真实 JPEG 编码',async()=>{const r=await adapter.handle('export',{mode:'original',format:'jpeg',background:'#17314c'}),c=capture(await createImageBitmap(r.blob),'导出 JPG',true),bytes=new Uint8Array(await r.blob.slice(0,3).arrayBuffer());assert(r.blob.type==='image/jpeg'&&bytes[0]===255&&bytes[1]===216,'JPEG 编码错误');assert(near(pixel(c,0,0),[23,49,76,255],4),'JPG 背景错误');});
      await check('图片可导出水印且不污染后续原图预览',async()=>{const r=await adapter.handle('export',{mode:'original',format:'png',watermark:{enabled:true,text:'IMAGE',position:'center',color:'#ff0055',opacity:1,size:15}}),marked=capture(await createImageBitmap(r.blob),'图片水印 PNG',true);assert(difference(original,marked)>30,'水印未出现');const after=capture((await adapter.handle('render',{mode:'original',maxSize:200})).bitmap);assert(difference(original,after)===0,'水印污染源图');});
      await check('导出预览与缩小输出报告正确尺寸',async()=>{const p=await adapter.handle('exportPreview',{mode:'original',format:'jpeg',exportSize:100,maxSize:80}),r=await adapter.handle('export',{mode:'original',format:'png',exportSize:100});assert(p.width===80&&p.height===48&&p.exportWidth===100&&p.exportHeight===60,'预览尺寸不正确');assert(r.width===100&&r.height===60,'缩小导出尺寸错误');p.bitmap.close();});
      await check('JPG 图片能直接导入',async()=>{const solid=document.createElement('canvas');solid.width=200;solid.height=120;solid.getContext('2d').fillStyle='#ffffff';solid.getContext('2d').fillRect(0,0,200,120);solid.getContext('2d').drawImage(source,0,0);const file=new File([await toBlob(solid,'image/jpeg')],'sample.jpg',{type:'image/jpeg'});const doc=(await newAdapter().open(file)).doc,c=capture((await adapter.handle('render',{mode:'original',maxSize:200})).bitmap);assert(doc.imageFormat==='JPG'&&c.width===200&&c.height===120,'JPG导入失败');assert(pixel(c,0,0)[3]===255,'JPG存在透明像素');});
      await check('WebP 图片能直接导入并保留透明背景',async()=>{const blob=await toBlob(source,'image/webp');assert(blob.type==='image/webp','测试浏览器不支持 WebP 编码');const doc=(await newAdapter().open(new File([blob],'sample.webp',{type:'image/webp'}))).doc,c=capture((await adapter.handle('render',{mode:'original',maxSize:200})).bitmap);assert(doc.imageFormat==='WebP'&&pixel(c,0,0)[3]===0,'WebP 解码或透明像素错误');});
      await check('BMP 图片可通过浏览器原生解码',async()=>{const doc=(await newAdapter().open(bmpFile())).doc,c=capture((await adapter.handle('render',{mode:'original',maxSize:10})).bitmap);assert(doc.imageFormat==='BMP'&&doc.width===3&&doc.height===2,'BMP 尺寸错误');assert(near(pixel(c,1,1),[240,90,20,255],0),'BMP 像素错误');});
      await check('JPEG 按 EXIF 方向读取自然尺寸与像素',async()=>{const doc=(await newAdapter().open(await orientedJpeg())).doc,c=capture((await adapter.handle('render',{mode:'original',maxSize:100})).bitmap,'EXIF 旋转',true);assert(doc.width===20&&doc.height===40,`方向未应用: ${doc.width}×${doc.height}`);assert(pixel(c,10,5)[0]>240&&pixel(c,10,35)[2]>240,'EXIF 像素方向错误');});
      let gifAdapter;
      await check('GIF 以静态首帧导入并提示限制',async()=>{gifAdapter=newAdapter();const doc=(await gifAdapter.open(gifFile())).doc,c=capture((await gifAdapter.handle('render',{mode:'original'})).bitmap,'GIF 首帧');assert(doc.imageFormat==='GIF'&&doc.warnings.some(w=>w.includes('首帧')),'缺少 GIF 首帧说明');assert(near(pixel(c,0,0),[255,0,0,255],0),'未显示 GIF 第一帧');});
      await check('坏图片返回可读错误',async()=>{let error;try{await new window.LayerDeskImageDocument({requestWorker}).open(new File(['not an image'],'broken.png',{type:'image/png'}));}catch(e){error=e.message;}assert(error&&/图片|解码/.test(error),'坏图未返回可读错误');return error;});
      await check('超大 PNG 在解码前按像素预算拒绝',async()=>{const bytes=new Uint8Array(24),v=new DataView(bytes.buffer);bytes.set([137,80,78,71,13,10,26,10]);v.setUint32(16,20000);v.setUint32(20,10000);let error;try{await new window.LayerDeskImageDocument({requestWorker}).open(new File([bytes],'huge.png',{type:'image/png'}));}catch(e){error=e.message;}assert(error?.includes('像素'),'大图没有提前拒绝');return error;});
      await check('GIF 后续预览仍为冻结的第一帧',async()=>{const c=capture((await gifAdapter.handle('render',{mode:'original'})).bitmap);assert(near(pixel(c,0,0),[255,0,0,255],0),'GIF在预览期间发生动画变化');});
      await check('关闭图片后拒绝继续使用',async()=>{adapter.dispose();let message;try{await adapter.handle('render',{mode:'original'});}catch(e){message=e.message;}assert(message?.includes('关闭'),'dispose后仍允许渲染');});
    }catch(error){await check('验收初始化或流程异常',()=>{throw error;});}
    finally{busy=false;update();}
  }
  $('run').onclick=run;run();
})();
</script>
</html>
