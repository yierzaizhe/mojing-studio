<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨境 Studio · PSD 文件读取验收</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17191d;color:#dce1e8;font:14px/1.6 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:20px}h1{font-size:24px;margin:0}p{color:#abb5c4}button{padding:8px 14px;background:#2b3342;color:#e5ecf8;border:1px solid #46536a;border-radius:4px;cursor:pointer}button:disabled{opacity:.5}a{color:#8dbbff}#summary{padding:12px 14px;background:#252a34;border:1px solid #3d485a;margin:16px 0}.pass{color:#80ddb0}.fail{color:#ff8b8b}iframe{display:block;width:100%;height:760px;border:1px solid #535a66;background:#292929}pre{font:12px/1.5 ui-monospace,monospace;padding:16px;background:#101216;white-space:pre-wrap}</style>
<main><h1>PSD 文件读取与取消验收</h1><p>在真实工作台中注入同文案的文件 I/O 失败，检查备用读取、ArrayBuffer 转移及取消后的导入恢复。</p><button id="run">重新运行</button> <a href="../index.html">返回工作台</a><div id="summary">准备验收…</div><ol id="checks"></ol><iframe id="preview" title="墨境 Studio PSD 文件读取实际界面"></iframe><pre id="result">{}</pre></main>
<script>
(() => {
 'use strict';const $=id=>document.getElementById(id),records=[];let busy=false,win,doc,fixture;
 const el=id=>doc.getElementById(id),canvas=()=>el('stage-canvas'),assert=(v,m)=>{if(!v)throw new Error(m);},sleep=ms=>new Promise(r=>setTimeout(r,ms));
 async function until(fn,label){const start=performance.now();while(performance.now()-start<45000){if(fn())return;await sleep(20);}throw new Error('等待超时：'+label);}
 const tabs=()=>[...doc.querySelectorAll('.document-tab-item')],tab=name=>tabs().find(t=>t.querySelector('.document-tab-name')?.textContent===name);
 async function committed(name){await until(()=>el('document-tab').textContent===name&&!canvas().hidden&&canvas().width>1&&el('canvas-viewport').getAttribute('aria-busy')==='false'&&el('loading-overlay').hidden,'完成 '+name);await new Promise(r=>win.requestAnimationFrame(()=>win.requestAnimationFrame(r)));}
 const make=name=>new win.File([fixture],name,{type:'image/vnd.adobe.photoshop',lastModified:0});
 function imports(...files){const t=new win.DataTransfer();for(const f of files)t.items.add(f);el('file-input').files=t.files;el('file-input').dispatchEvent(new win.Event('change',{bubbles:true}));}
 function update(){const result={done:!busy,passed:records.filter(r=>r.pass).length,failed:records.filter(r=>!r.pass).length,checks:records};$('result').textContent=JSON.stringify(result,null,2);$('summary').textContent=`${busy?'运行中':'验收结束'} · ${result.passed} 项通过 · ${result.failed} 项失败`;$('summary').className=result.failed?'fail':'pass';$('run').disabled=busy;}
 async function check(name,fn){const li=document.createElement('li'),start=performance.now();li.textContent='运行 · '+name;$('checks').append(li);try{const detail=await fn();records.push({name,pass:true,ms:Math.round(performance.now()-start),detail});li.className='pass';li.textContent='PASS · '+name;}catch(error){records.push({name,pass:false,error:error.message});li.className='fail';li.textContent='FAIL · '+name+' · '+error.message;}update();}
 async function run(){if(busy)return;busy=true;records.length=0;$('checks').replaceChildren();update();try{
  let source=await (await fetch('../index.html',{cache:'no-store'})).text();
  const instrument=`(() => {
   const io=window.__ioCheck={primary:[],fallback:[],workerOpens:[],workerErrors:[],readerAborted:false};
   const nativeArrayBuffer=Blob.prototype.arrayBuffer;Blob.prototype.arrayBuffer=function(){io.primary.push(this.name||'blob');if(this.name==='io-primary-cancel.psd')return new Promise(resolve=>{io.release=()=>nativeArrayBuffer.call(this).then(resolve);});if(/^io-(?:fallback|fail|reader-cancel)/.test(this.name||''))return Promise.reject(new DOMException('The I/O read operation failed.','NotReadableError'));return nativeArrayBuffer.call(this);};
   const NativeReader=window.FileReader;window.FileReader=class extends NativeReader{
    get error(){return this.testError||super.error;}
    readAsArrayBuffer(file){io.fallback.push(file.name);if(file.name==='io-fail.psd'){this.testError=new DOMException('The I/O read operation failed.','NotReadableError');setTimeout(()=>this.onerror?.(new Event('error')),0);return;}if(file.name==='io-reader-cancel.psd'){io.readerStarted=true;this.delayed=setTimeout(()=>super.readAsArrayBuffer(file),1000);return;}super.readAsArrayBuffer(file);}
    abort(){if(this.delayed){clearTimeout(this.delayed);io.readerAborted=true;}super.abort();}
   };
   const NativeWorker=window.Worker;window.Worker=class extends NativeWorker{
    constructor(...args){super(...args);this.addEventListener('message',e=>{if(e.data.ok===false)io.workerErrors.push(e.data.error);});}
    postMessage(message,transfer){let record;if(message.type==='open'){record={name:message.name||message.file?.name,hasFile:!!message.file,hasBuffer:message.buffer instanceof ArrayBuffer,hasTransfer:!!transfer?.includes(message.buffer)};io.workerOpens.push(record);if(message.file)throw new DOMException('The I/O read operation failed.','NotReadableError');}super.postMessage(message,transfer);if(record)record.detached=message.buffer.byteLength===0;}
   };
  })();`;
  source=source.replace('<head>','<head><script>'+instrument+'<'+ '/script>');const frame=$('preview'),loaded=new Promise(r=>frame.addEventListener('load',r,{once:true}));frame.srcdoc=source;await loaded;win=frame.contentWindow;doc=frame.contentDocument;await until(()=>el('file-input')?.onchange&&win.LayerDeskLocalFile,'工作台就绪');fixture=await (await fetch('compositing.psd',{cache:'no-store'})).arrayBuffer();
  await check('页面读取真实PSD后转移字节，Worker不再接收File引用',async()=>{const name='io-normal.psd';imports(make(name));await committed(name);const r=win.__ioCheck.workerOpens.find(r=>r.name===name);assert(r&&!r.hasFile&&r.hasBuffer&&r.hasTransfer&&r.detached,'没有以transfer传递已读取的字节');assert(el('layer-count').textContent==='13','图层结构或文件名称错误');return r;});
  await check('同文案I/O失败自动回退真实FileReader并正常打开图层',async()=>{const name='io-fallback.psd';imports(make(name));await committed(name);assert(win.__ioCheck.fallback.includes(name),'没有使用FileReader回退');assert(el('layer-count').textContent==='13'&&canvas().width===128,'备用读取没有恢复实际PSD');assert(win.__ioCheck.workerErrors.length===0,'I/O失败被传入后台');return{name,layers:13,fallback:true};});
  await check('两种读取均失败时提示本机文件I/O，后续队列继续',async()=>{const good='io-after-failure.psd';imports(make('io-fail.psd'),make(good));await committed(good);assert(tab('io-fail.psd')?.classList.contains('failed'),'双重读取失败没有失败标签');assert(/无法读取本机文件/.test(el('toast').textContent),'没有给出本机文件读取指导');assert(!/PSD 文件结构异常/.test(el('toast').textContent),'I/O错误被误判为PSD损坏');return{failed:'io-fail.psd',recovered:good};});
  await check('成功读取到坏PSD字节时仍报告格式错误',async()=>{const good='io-after-invalid.psd',bad=new win.File(['not a photoshop file'],'io-invalid.psd',{type:'application/octet-stream'});imports(bad,make(good));await committed(good);assert(tab(bad.name)?.classList.contains('failed'),'坏PSD没有失败标签');assert(/有效的 Photoshop/.test(el('toast').textContent),'格式错误被误判为I/O失败');return{formatFailure:true,queueRecovered:true};});
  await check('取消首次读取后立即继续队列，迟到字节不恢复旧标签',async()=>{const slow='io-primary-cancel.psd',good='io-after-cancel.psd';imports(make(slow),make(good));await until(()=>win.__ioCheck.release&&!el('loading-overlay').hidden,'可取消的首次读取');el('cancel-btn').click();await committed(good);const count=tabs().length;win.__ioCheck.release();await sleep(100);assert(!tab(slow)&&tabs().length===count&&el('document-tab').textContent===good,'晚到字节污染当前文档');assert(!win.__ioCheck.workerOpens.some(r=>r.name===slow),'取消后仍送入后台解析');return{cancelled:slow,recovered:good};});
  await check('取消备用FileReader时终止读取并保持后续导入',async()=>{const slow='io-reader-cancel.psd',good='io-final-recovery.psd';imports(make(slow),make(good));await until(()=>win.__ioCheck.readerStarted&&!el('loading-overlay').hidden,'可取消的备用读取');el('cancel-btn').click();await committed(good);assert(win.__ioCheck.readerAborted&&!tab(slow),'取消未中止FileReader');assert(!win.__ioCheck.workerOpens.some(r=>r.name===slow),'取消的备用读取仍送入后台');return{readerAborted:true,recovered:good};});
 }catch(error){await check('验收初始化或流程异常',()=>{throw error;});}finally{busy=false;update();}}
 $('run').onclick=run;run();
})();
</script></html>
