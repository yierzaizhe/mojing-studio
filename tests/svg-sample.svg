    <path id="grid-lines" d="M80 660H880M80 118H420" fill="none" stroke="#b7c1b6" stroke-width="1" aria-label="版式细线"/>
  </g>
  <g id="forms-group" aria-label="02 · 几何与渐变">
    <rect id="blue-panel" x="600" y="110" width="280" height="450" fill="#4977f0" aria-label="蓝色矩形"/>
    <circle id="orange-orb" cx="660" cy="340" r="155" fill="url(#orb-gradient)" aria-label="橙色渐变球体"/>
    <ellipse id="white-orbit" cx="693" cy="343" rx="90" ry="184" transform="rotate(35 693 343)" fill="none" stroke="#fff9eb" stroke-width="2" aria-label="旋转白色轨道"/>
    <path id="green-ring" d="M895 470a80 80 0 1 1-160 0a80 80 0 1 1 160 0M857 470a42 42 0 1 0-84 0a42 42 0 1 0 84 0" fill="#295c4e" fill-rule="evenodd" aria-label="森林绿镂空圆环"/>
    <use id="cross-instance" href="#cross-symbol" x="861" y="79" width="30" height="30" color="#24372f" aria-label="符号实例·十字"/>
    <rect id="masked-accent" x="600" y="575" width="280" height="16" fill="#ee8750" mask="url(#fade-mask)" aria-label="蒙版渐隐色条"/>
    <image id="embedded-image" x="801" y="583" width="68" height="68" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAALElEQVR4nGPwLP/wHxlrxvihYELyDMPAAFI1oMsPBwMGPhYG3oCBj4UBNwAACN5An7987GMAAAAASUVORK5CYII=" clip-path="url(#image-clip)" aria-label="内嵌棋盘图片"/>
    <text id="figure-label" class="copy small" x="600" y="616">FIG. 02 / VECTOR STUDY</text>
  </g>
  <g id="type-group" aria-label="03 · 标题与信息" class="copy">
