    <linearGradient id="fade-gradient"><stop stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <mask id="fade-mask" maskUnits="userSpaceOnUse" x="600" y="575" width="280" height="16"><rect x="600" y="575" width="280" height="16" fill="url(#fade-gradient)"/></mask>
    <clipPath id="image-clip"><circle cx="835" cy="617" r="34"/></clipPath>
    <symbol id="cross-symbol" viewBox="0 0 30 30"><path d="M15 0v30M0 15h30" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <style>.copy{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#24372f}.small{font-size:12px;letter-spacing:1px}.hidden-variant{display:none}</style>
  </defs>
  <g id="paper-group" aria-label="01 · 纸张与细线">
